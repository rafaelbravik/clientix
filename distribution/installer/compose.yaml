# Compose Comercial do Clientix Agência
# Todos os serviços executam a partir de imagens publicadas/pre-buildadas.
# Zero compilação local, zero acesso a repositório git.

services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE must be set from the verified release manifest}
    restart: unless-stopped
    mem_limit: 768m
    env_file: .env
    environment:
      CLIENTIX_INGRESS_MODE: "production"
      CLIENTIX_ALLOW_INSECURE_HTTP: "false"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL must use the configured HTTPS domain}
      NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:?NEXT_PUBLIC_ADMIN_URL must use the configured HTTPS domain}
      CLIENTIX_ADMIN_ORIGIN: ${CLIENTIX_ADMIN_ORIGIN:-${NEXT_PUBLIC_ADMIN_URL:?NEXT_PUBLIC_ADMIN_URL must use the configured HTTPS domain}}
      PORT: "3000"
      SUPABASE_DB_ADMIN_URL: ""
    # GID 1001 é o grupo leitor de licença preparado pelo instalador.
    group_add:
      - "1001"
    volumes:
      - ./licenses:/opt/clientix/licenses:rw
      - ./state:/opt/clientix/state:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - clientix-net
      - clientix-ingress

  worker:
    image: ${WORKER_IMAGE:?WORKER_IMAGE must be set from the verified release manifest}
    restart: unless-stopped
    mem_limit: 512m
    env_file: .env
    environment:
      SUPABASE_DB_ADMIN_URL: ""
    group_add:
      - "1001"
    volumes:
      - ./licenses:/opt/clientix/licenses:ro
      - ./state:/opt/clientix/state:ro
    networks:
      - clientix-net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/healthz').then(async r=>{const d=await r.json();process.exit(r.status===200&&d.status==='ok'&&d.db==='ok'&&d.event_log_drain?.carregado===true&&d.event_log_drain?.motivo===null?0:1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 20s

  scheduler:
    image: ${SCHEDULER_IMAGE:?SCHEDULER_IMAGE must be set from the verified release manifest}
    restart: unless-stopped
    mem_limit: 256m
    env_file: .env
    environment:
      SUPABASE_DB_ADMIN_URL: ""
    networks:
      - clientix-net

  voice-agent:
    profiles: ["telefonia"]
    image: ${VOICE_AGENT_IMAGE:?VOICE_AGENT_IMAGE must be set from the verified release manifest}
    restart: unless-stopped
    mem_limit: 512m
    env_file: .env
    environment:
      SUPABASE_DB_ADMIN_URL: ""
    group_add:
      - "1001"
    volumes:
      - ./licenses:/opt/clientix/licenses:ro
      - ./state:/opt/clientix/state:ro
    networks:
      - clientix-net

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.11.7-alpine@sha256:24ec7b05bc532c7bb57f727030c5056e257ff7138b4b50460306819ff79362bd}
    restart: unless-stopped
    mem_limit: 128m
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be a public fully-qualified hostname}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required for certificate operations}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - clientix-ingress

networks:
  clientix-net:
    driver: bridge
  clientix-ingress:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
