# Compose Comercial do Clientix Agência
# Todos os serviços executam a partir de imagens publicadas/pre-buildadas.
# Zero compilação local, zero acesso a repositório git.

services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE must be set from the verified release manifest}
    restart: unless-stopped
    mem_limit: 768m
    env_file: .env
    environment:
      # PORT no .env é a porta publicada no host. Next.js escuta sempre na
      # porta interna do contêiner, independente do mapeamento do host.
      PORT: "3000"
      SUPABASE_DB_ADMIN_URL: ""
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./licenses:/opt/clientix/licenses:rw
      - ./state:/opt/clientix/state:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - clientix-net

  worker:
    image: ${WORKER_IMAGE:?WORKER_IMAGE must be set from the verified release manifest}
    restart: unless-stopped
    mem_limit: 512m
    env_file: .env
    environment:
      SUPABASE_DB_ADMIN_URL: ""
    group_add:
      - "1001"
    volumes:
      - ./licenses:/opt/clientix/licenses:ro
      - ./state:/opt/clientix/state:ro
    networks:
      - clientix-net

  scheduler:
    image: ${SCHEDULER_IMAGE:?SCHEDULER_IMAGE must be set from the verified release manifest}
    restart: unless-stopped
    mem_limit: 256m
    env_file: .env
    environment:
      SUPABASE_DB_ADMIN_URL: ""
    networks:
      - clientix-net

  voice-agent:
    profiles: ["telefonia"]
    image: ${VOICE_AGENT_IMAGE:?VOICE_AGENT_IMAGE must be set from the verified release manifest}
    restart: unless-stopped
    mem_limit: 512m
    env_file: .env
    environment:
      SUPABASE_DB_ADMIN_URL: ""
    group_add:
      - "1001"
    volumes:
      - ./licenses:/opt/clientix/licenses:ro
      - ./state:/opt/clientix/state:ro
    networks:
      - clientix-net

networks:
  clientix-net:
    driver: bridge
